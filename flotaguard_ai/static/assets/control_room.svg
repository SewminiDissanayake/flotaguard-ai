  </g>
  <g fill="#6df2a5"><circle cx="190" cy="720" r="8"/><circle cx="245" cy="720" r="8"/><circle cx="300" cy="720" r="8"/><circle cx="515" cy="720" r="8"/><circle cx="570" cy="720" r="8"/></g>
  <g fill="#d6a84a"><circle cx="355" cy="720" r="8"/><circle cx="625" cy="720" r="8"/><circle cx="840" cy="720" r="8"/></g>
  <g stroke="#77857c" stroke-width="8" stroke-linecap="round"><path d="M180 770h210M505 770h210M830 770h210M1155 770h210"/></g>
  <g stroke="#d7e2dc" stroke-width="5" opacity=".7"><path d="M205 775v-32M250 775v-18M295 775v-40M340 775v-25M530 775v-42M575 775v-20M620 775v-33M665 775v-16M855 775v-23M900 775v-38M945 775v-17M990 775v-31M1180 775v-35M1225 775v-21M1270 775v-42M1315 775v-26"/></g>

