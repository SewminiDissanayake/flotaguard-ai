<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08110d"/><stop offset=".45" stop-color="#101a14"/><stop offset="1" stop-color="#050907"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2d3830"/><stop offset=".55" stop-color="#202a23"/><stop offset="1" stop-color="#111813"/></linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#323a31"/><stop offset="1" stop-color="#171d19"/></linearGradient>
    <radialGradient id="screen"><stop stop-color="#74ffb2" stop-opacity=".55"/><stop offset=".42" stop-color="#2e8f61" stop-opacity=".28"/><stop offset="1" stop-color="#0d2418" stop-opacity=".1"/></radialGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#83522e" stop-opacity=".05"/><stop offset=".5" stop-color="#b36a34" stop-opacity=".22"/><stop offset="1" stop-color="#552e18" stop-opacity=".06"/></linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence baseFrequency=".75" numOctaves="2" seed="11" type="fractalNoise"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
    <pattern id="stripe" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="17" height="34" fill="#d09b30"/><rect x="17" width="17" height="34" fill="#1b211c"/></pattern>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <ellipse cx="1230" cy="120" rx="440" ry="170" fill="#315a42" opacity=".11" filter="url(#soft)"/>
  <ellipse cx="260" cy="770" rx="460" ry="180" fill="#5b3a1e" opacity=".12" filter="url(#soft)"/>

  <!-- ceiling / structure -->
  <path d="M0 0h1600v120H0z" fill="#0e1511"/><path d="M0 118h1600" stroke="#3b493f" stroke-width="6" opacity=".65"/>
  <g stroke="#4b5a4f" stroke-width="8" opacity=".28"><path d="M120 0v120M420 0v120M790 0v120M1160 0v120M1470 0v120"/></g>
  <g fill="#d7dbc7" opacity=".62"><rect x="160" y="28" width="230" height="28" rx="6"/><rect x="690" y="28" width="230" height="28" rx="6"/><rect x="1210" y="28" width="230" height="28" rx="6"/></g>

