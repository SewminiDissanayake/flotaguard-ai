  <path d="M1040 152c28 75-12 118 18 186s-8 145 18 250" stroke="#8c4a28" stroke-width="8" opacity=".16" fill="none"/><path d="M390 155c-18 72 25 130-8 205s15 145-2 245" stroke="#9a542b" stroke-width="6" opacity=".12" fill="none"/>

