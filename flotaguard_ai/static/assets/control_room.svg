      <circle cx="0" cy="0" r="7" fill="#65ef9e" filter="url(#glow)"/><circle cx="55" cy="0" r="7" fill="#65ef9e"/><circle cx="110" cy="0" r="7" fill="#d9ad43"/><circle cx="165" cy="0" r="7" fill="#65ef9e"/><circle cx="220" cy="0" r="7" fill="#65ef9e"/><circle cx="275" cy="0" r="7" fill="#d26a4d"/><circle cx="330" cy="0" r="7" fill="#65ef9e"/>
      <g fill="#819387" font-family="monospace" font-size="9"><text x="-10" y="29">P-01</text><text x="45" y="29">P-02</text><text x="100" y="29">W-03</text><text x="155" y="29">P-04</text><text x="210" y="29">P-05</text><text x="265" y="29">AL-6</text><text x="320" y="29">P-07</text></g>
      <g stroke="#6f7f74" stroke-width="2"><path d="M0 50h340"/><path d="M0 62h340"/></g>
    </g></g>
