    <rect x="315" y="390" width="160" height="120" rx="10" fill="#0b0f0c" stroke="#68766b" stroke-width="3"/><rect x="327" y="402" width="136" height="92" rx="5" fill="url(#screen)"/>
    <rect x="570" y="390" width="160" height="120" rx="10" fill="#0b0f0c" stroke="#68766b" stroke-width="3"/><rect x="582" y="402" width="136" height="92" rx="5" fill="url(#screen)"/>
    <rect x="760" y="390" width="160" height="120" rx="10" fill="#0b0f0c" stroke="#68766b" stroke-width="3"/><rect x="772" y="402" width="136" height="92" rx="5" fill="url(#screen)"/>
