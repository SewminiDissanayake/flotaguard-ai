  <rect x="55" y="150" width="1490" height="470" rx="18" fill="url(#metal)" stroke="#435149" stroke-width="3"/>
  <rect x="74" y="170" width="1452" height="40" rx="8" fill="#151d18"/>
  <text x="104" y="197" fill="#93a99c" font-size="18" font-family="monospace" letter-spacing="5">FLOTATION CONTROL / ARCHIVE CONSOLE 07</text>

