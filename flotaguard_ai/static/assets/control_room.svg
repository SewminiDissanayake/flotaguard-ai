    <circle cx="600" cy="300" r="38"/><circle cx="695" cy="300" r="38"/><circle cx="790" cy="300" r="38"/><circle cx="885" cy="300" r="38"/>
    <circle cx="1050" cy="300" r="38"/><circle cx="1145" cy="300" r="38"/><circle cx="1240" cy="300" r="38"/><circle cx="1335" cy="300" r="38"/><circle cx="1430" cy="300" r="38"/>
