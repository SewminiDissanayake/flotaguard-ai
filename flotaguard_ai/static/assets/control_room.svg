    <text x="600" y="353">PH</text><text x="695" y="353">DENS</text><text x="790" y="353">AMINA</text><text x="885" y="353">STARCH</text>
    <text x="1050" y="353">LVL 01</text><text x="1145" y="353">LVL 02</text><text x="1240" y="353">LVL 03</text><text x="1335" y="353">LVL 04</text><text x="1430" y="353">SILICA</text>
  </g>

